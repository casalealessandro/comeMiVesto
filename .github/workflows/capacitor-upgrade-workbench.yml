name: Capacitor Upgrade Workbench

on:
  push:
    branches:
      - chore/upgrade-capacitor-8

permissions:
  contents: write

jobs:
  refresh-generated-files:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: chore/upgrade-capacitor-8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh npm lock file
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Synchronize Android
        run: npx cap sync android

      - name: Synchronize iOS
        run: npx cap sync ios

      - name: Register SceneDelegate in Xcode project
        shell: bash
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          app_group = project.main_group['App']
          target = project.targets.find { |item| item.name == 'App' }

          scene_file = app_group.files.find { |item| item.path == 'SceneDelegate.swift' }
          scene_file ||= app_group.new_file('SceneDelegate.swift')

          unless target.source_build_phase.files_references.include?(scene_file)
            target.source_build_phase.add_file_reference(scene_file)
          end

          project.build_configurations.each do |configuration|
            current = configuration.build_settings['IPHONEOS_DEPLOYMENT_TARGET']
            if current && Gem::Version.new(current) < Gem::Version.new('15.0')
              configuration.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
            end
          end

          project.save
          RUBY

      - name: Commit refreshed generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json android ios

          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi

          git commit -m "chore(capacitor): refresh generated native files"
          git push origin HEAD:chore/upgrade-capacitor-8

  validate-upgrade:
    if: github.actor == 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Synchronize Android
        run: npx cap sync android

      - name: Synchronize iOS
        run: npx cap sync ios

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
