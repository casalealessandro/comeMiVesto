name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify guest invitation timer and Ionic dialog
        run: |
          npm test -- --watch=false --browsers=ChromeHeadlessCI \
            --include=src/app/views/layout-tabs/guest-outfit-nudge.spec.ts \
            --include=src/app/views/layout-tabs/layout-tabs.page.spec.ts \
            --include=src/app/components/guest-save-dialog/guest-save-dialog.component.spec.ts
      - run: npm run build -- --configuration=dev
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMEMIVESTO_5E5F9 }}
          projectId: comemivesto-5e5f9
