name: Come Mi Vesto Android Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
      - develop

  workflow_call:
    inputs:
      publish:
        description: Publish the build to Google Play Internal Testing
        required: false
        default: false
        type: boolean
      build_configuration:
        description: Angular environment configuration
        required: false
        default: production
        type: string
      source_ref:
        description: Source ref to build
        required: false
        default: ''
        type: string

  workflow_dispatch:
    inputs:
      publish:
        description: Publish the build to Google Play Internal Testing
        required: false
        default: false
        type: boolean
      build_configuration:
        description: Angular environment configuration
        required: false
        default: production
        type: choice
        options:
          - production
          - dev
      source_ref:
        description: Source ref to build
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: comemivesto-android-release
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.source_ref || github.sha }}

      - name: Show build provenance
        shell: bash
        run: |
          echo "Build configuration: ${{ inputs.build_configuration || 'production' }}"
          echo "Requested source_ref: ${{ inputs.source_ref || 'n/a' }}"
          echo "Checked out ref: ${{ github.event.pull_request.head.sha || inputs.source_ref || github.sha }}"
          echo "Source commit: $(git rev-parse HEAD)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        shell: bash
        env:
          BUILD_CONFIGURATION: ${{ inputs.build_configuration }}
        run: |
          set -euo pipefail

          BUILD_CONFIGURATION="${BUILD_CONFIGURATION:-production}"
          case "$BUILD_CONFIGURATION" in
            production|dev) ;;
            *)
              echo "Unsupported build_configuration: $BUILD_CONFIGURATION" >&2
              exit 1
              ;;
          esac

          echo "Building Angular configuration: $BUILD_CONFIGURATION"
          GIT_COMMIT_SHA="$(git rev-parse HEAD)" node tools/generate-build-info.mjs
          npm run build -- --configuration="$BUILD_CONFIGURATION"

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: www
          if-no-files-found: error
          retention-days: 1

  android-build:
    name: Android Build
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version_name: ${{ steps.android_version.outputs.version_name }}
      version_code: ${{ steps.android_version.outputs.version_code }}
      release_tag: ${{ steps.android_version.outputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Calculate Android version
        id: android_version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must match X.Y.Z" >&2
            exit 1
          fi

          LATEST_CODE=0
          while IFS= read -r tag; do
            code="${tag##*-code}"
            if [[ "$code" =~ ^[0-9]+$ ]] && (( code > LATEST_CODE )); then
              LATEST_CODE=$code
            fi
          done < <(git tag --list 'android-v*-code*')

          NEXT_VERSION_CODE=$((LATEST_CODE + 1))
          ANDROID_RELEASE_TAG="android-v${VERSION_NAME}-code${NEXT_VERSION_CODE}"

          echo "ANDROID_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$NEXT_VERSION_CODE" >> "$GITHUB_ENV"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$NEXT_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "release_tag=$ANDROID_RELEASE_TAG" >> "$GITHUB_OUTPUT"

          echo "Commercial version: $VERSION_NAME"
          echo "Next Android release: $ANDROID_RELEASE_TAG"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: www

      - name: Synchronize Capacitor Android project
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Restore Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/comemivesto-release.jks
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

          keytool -list \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null

      - name: Build signed Android App Bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/comemivesto-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Verify AAB signature
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary keystore
        if: always()
        run: rm -f "${{ runner.temp }}/comemivesto-release.jks"

  android-smoke:
    name: Android Smoke
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_PATH: /tmp/comemivesto-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: www

      - name: Synchronize Android
        run: npx cap sync android

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Run Android emulator smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"

  ios-smoke:
    name: iOS Smoke
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: www

      - name: Synchronize iOS
        run: npx cap sync ios

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Prepare iOS simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')"
          test -n "$DEVICE"
          echo "Using simulator $DEVICE"
          echo "udid=$DEVICE" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Run iOS simulator smoke
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.udid }}
        run: bash .github/scripts/ios-smoke.sh "$DEVICE_ID" "$RUNNER_TEMP/DerivedData"

      - name: Validate public association files
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://comemivesto.app/.well-known/assetlinks.json" -o /tmp/assetlinks.json
          curl -fsSL "https://comemivesto.app/.well-known/apple-app-site-association" -o /tmp/aasa.json

          python3 - <<'PY'
          import json

          with open('/tmp/assetlinks.json', encoding='utf-8') as f:
              assetlinks = json.load(f)
          assert any(
              item.get('target', {}).get('package_name') == 'com.acasale.comemivesto'
              for item in assetlinks
          ), 'Android assetlinks does not contain ComeMiVesto package'

          with open('/tmp/aasa.json', encoding='utf-8') as f:
              aasa = json.load(f)
          details = aasa.get('applinks', {}).get('details', [])
          assert any(
              item.get('appID') == 'Z9SD7XVK87.com.acasale.comemivesto'
              for item in details
          ), 'Apple association file does not contain ComeMiVesto appID'
          PY

      - name: Shutdown iOS simulator
        if: always()
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.udid }}
        run: |
          if [ -n "$DEVICE_ID" ]; then
            xcrun simctl shutdown "$DEVICE_ID" || true
          fi

  release:
    name: Release
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Android build
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: release

      - name: Verify release artifact
        run: test -f release/app-release.aab

      - name: Publish release artifact
        uses: actions/upload-artifact@v4
        with:
          name: comemivesto-android-${{ needs.android-build.outputs.version_name }}-code${{ needs.android-build.outputs.version_code }}
          path: release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to Google Play Internal Testing
    needs:
      - release
      - android-build
    permissions:
      contents: write
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.publish == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: comemivesto-android-${{ needs.android-build.outputs.version_name }}-code${{ needs.android-build.outputs.version_code }}
          path: release

      - name: Deploy to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.acasale.comemivesto
          releaseFiles: release/app-release.aab
          tracks: internal
          status: completed
          changesNotSentForReview: false

      - name: Create Android release tag
        env:
          RELEASE_TAG: ${{ needs.android-build.outputs.release_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag $RELEASE_TAG already exists" >&2
            exit 1
          fi

          git tag "$RELEASE_TAG" HEAD
          git push origin "$RELEASE_TAG"

          echo "Created release tag: $RELEASE_TAG"
