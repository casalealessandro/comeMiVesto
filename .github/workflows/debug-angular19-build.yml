name: Debug Angular 19 build

on:
  push:
    branches:
      - codex/migra-comemivesto-ad-angular-19
    paths-ignore:
      - '.github/angular19-build-error.txt'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: codex/migra-comemivesto-ad-angular-19

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture Angular build output
        id: build
        shell: bash
        run: |
          set +e
          npm run build > /tmp/angular-build.log 2>&1
          status=$?
          tail -n 250 /tmp/angular-build.log > .github/angular19-build-error.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit diagnostics
        if: steps.build.outputs.status != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/angular19-build-error.txt
          git commit -m "chore: capture Angular build error" || exit 0
          git push

      - name: Fail when Angular build fails
        if: steps.build.outputs.status != '0'
        run: exit 1
