name: Regenerate Angular 19 lockfile

on:
  push:
    branches:
      - codex/migra-comemivesto-ad-angular-19
    paths:
      - package.json

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: codex/migra-comemivesto-ad-angular-19
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate package-lock.json
        run: npm install --package-lock-only

      - name: Verify clean install
        run: npm ci

      - name: Commit package-lock.json
        shell: bash
        run: |
          if git diff --quiet package-lock.json; then
            echo "package-lock.json already aligned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: align Ionic 8 lockfile"
          git push origin HEAD:codex/migra-comemivesto-ad-angular-19
