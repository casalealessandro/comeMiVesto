name: Deploy develop to Firebase Hosting

on:
  push:
    branches:
      - develop

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build -- --configuration=dev

      - name: Configure Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMEMIVESTO_5E5F9 }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Ensure develop Hosting site exists
        run: |
          set +e
          OUTPUT=$(npx firebase-tools@15.22.1 hosting:sites:create comemivesto-5e5f9-develop --project comemivesto-5e5f9 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            echo "$OUTPUT" | grep -Eiq "already exists|409|duplicate" || exit $STATUS
          fi

      - name: Deploy develop site
        run: |
          npx firebase-tools@15.22.1 deploy \
            --only hosting \
            --config firebase.develop.json \
            --project comemivesto-5e5f9 \
            --non-interactive

      - name: Smoke test develop site
        run: |
          URL="https://comemivesto-5e5f9-develop.web.app"
          echo "Testing $URL"
          curl --fail --location --retry 5 --retry-delay 5 "$URL" -o /tmp/develop.html
          grep -q "<app-root" /tmp/develop.html
