name: Come Mi Vesto Mobile Version

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - VERSION

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate mobile version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate VERSION
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version in X.Y.Z format" >&2
            exit 1
          fi

          LATEST_VERSION="$(
            {
              git tag --list 'release-v*' |
                sed -nE 's/^release-v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p'
              git tag --list 'android-v*-code*' |
                sed -nE 's/^android-v([0-9]+\.[0-9]+\.[0-9]+)-code[0-9]+$/\1/p'
              git tag --list 'ios-v*-build*' |
                sed -nE 's/^ios-v([0-9]+\.[0-9]+\.[0-9]+)-build[0-9]+$/\1/p'
            } | sort -V | tail -n 1
          )"

          if [ -n "$LATEST_VERSION" ]; then
            LOWEST="$(printf '%s\n%s\n' "$VERSION_NAME" "$LATEST_VERSION" | sort -V | head -n 1)"
            if [ "$LOWEST" = "$VERSION_NAME" ] && [ "$VERSION_NAME" != "$LATEST_VERSION" ]; then
              echo "VERSION $VERSION_NAME is older than latest released version $LATEST_VERSION" >&2
              exit 1
            fi
          fi

          echo "VERSION $VERSION_NAME is valid"
