name: Android Firebase Test Lab

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-firebase-test-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  robo-test:
    name: Android Robo Test
    # Secrets are not exposed to workflows opened from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_PROJECT_ID: comemivesto-5e5f9
      APK_PATH: android/app/build/outputs/apk/debug/app-debug.apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build development web application
        run: npm run build -- --configuration=dev

      - name: Restore Android Firebase configuration
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: bash .github/scripts/restore-android-google-services.sh

      - name: Synchronize Capacitor Android project
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build Android APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify generated APK
        run: test -s "$APK_PATH"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMEMIVESTO_5E5F9 }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Run Firebase Test Lab Robo tests
        shell: bash
        run: |
          set -euo pipefail
          gcloud firebase test android run \
            --project="$FIREBASE_PROJECT_ID" \
            --type=robo \
            --app="$APK_PATH" \
            --device=model=MediumPhone.arm,version=30,locale=it,orientation=portrait \
            --device=model=MediumPhone.arm,version=35,locale=it,orientation=portrait \
            --timeout=5m

      - name: Upload tested APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-test-lab-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: warn
          retention-days: 7

      - name: Remove temporary Android Firebase configuration
        if: always()
        run: rm -f android/app/google-services.json
