name: Finalize CMV tutorial assets

on:
  push:
    branches:
      - chore/add-cmv-tutorial-assets

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[cmv-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and extract tutorial
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"

          head -c 12000 .cmv-tutorial-upload/part-00.b64 > "$tmp/archive.b64"
          for i in $(seq -w 1 17); do
            cat ".cmv-tutorial-upload/part-${i}.b64" >> "$tmp/archive.b64"
          done

          base64 --decode "$tmp/archive.b64" > "$tmp/CMV-Tutorial-repo.zip"
          unzip -t "$tmp/CMV-Tutorial-repo.zip"
          unzip -q "$tmp/CMV-Tutorial-repo.zip" -d "$tmp/extracted"

          rm -rf "CMV - Tutorial"
          mkdir -p "CMV - Tutorial"
          cp -R "$tmp/extracted/Immagini" "CMV - Tutorial/"
          cp -R "$tmp/extracted/Schermate Complete" "CMV - Tutorial/"

          rm -rf .cmv-tutorial-upload

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: add unzipped CMV tutorial assets [cmv-finalized]"
          git push
