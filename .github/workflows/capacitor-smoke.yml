name: Capacitor Smoke Test

on:
  push:
    branches:
      - chore/upgrade-capacitor-8
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-smoke:
    name: Android emulator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/comemivesto-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Synchronize Android
        run: npx cap sync android

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Run Android smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            APK="android/app/build/outputs/apk/release/app-release.apk"
            test -f "$APK"
            adb install -r "$APK"

            adb logcat -c
            adb shell monkey -p com.acasale.comemivesto -c android.intent.category.LAUNCHER 1
            sleep 8

            PID="$(adb shell pidof com.acasale.comemivesto | tr -d '\r')"
            test -n "$PID"
            echo "ComeMiVesto running with PID $PID"

            if adb logcat -d | grep -E "FATAL EXCEPTION|Process: com\.acasale\.comemivesto.*AndroidRuntime"; then
              echo "Android crash detected"
              exit 1
            fi

            adb shell pm verify-app-links --re-verify com.acasale.comemivesto || true
            sleep 12
            adb shell pm get-app-links com.acasale.comemivesto | tee /tmp/app-links.txt

            adb shell am start -W \
              -a android.intent.action.VIEW \
              -c android.intent.category.BROWSABLE \
              -d "https://comemivesto.app/detail-outfit/1"
            sleep 3

            adb shell dumpsys activity activities | grep -m1 "mResumedActivity\|topResumedActivity" | tee /tmp/resumed.txt
            grep -q "com.acasale.comemivesto" /tmp/resumed.txt

            echo "Custom scheme handlers (diagnostic only):"
            adb shell cmd package query-activities \
              -a android.intent.action.VIEW \
              -c android.intent.category.BROWSABLE \
              -d "comemivesto://outfit/1" || true

            if adb logcat -d | grep -E "FATAL EXCEPTION|Process: com\.acasale\.comemivesto.*AndroidRuntime"; then
              echo "Android crash detected after deep link"
              exit 1
            fi

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"

  ios-smoke:
    name: iOS simulator smoke
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Synchronize iOS
        run: npx cap sync ios

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run iOS smoke
        shell: bash
        run: |
          set -euo pipefail
          DEVICE="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')"
          test -n "$DEVICE"
          echo "Using simulator $DEVICE"

          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b

          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"
          xcrun simctl install "$DEVICE" "$APP_PATH"

          xcrun simctl launch "$DEVICE" com.acasale.comemivesto | tee /tmp/ios-launch.txt
          sleep 8

          xcrun simctl openurl "$DEVICE" "comemivesto://outfit/1"
          sleep 3
          xcrun simctl openurl "$DEVICE" "https://comemivesto.app/detail-outfit/1"
          sleep 3

          xcrun simctl launch "$DEVICE" com.acasale.comemivesto | tee /tmp/ios-relaunch.txt

          if find "$HOME/Library/Logs/DiagnosticReports" -type f -name 'App*.crash' -mmin -5 2>/dev/null | grep -q .; then
            echo "iOS crash report detected"
            find "$HOME/Library/Logs/DiagnosticReports" -type f -name 'App*.crash' -mmin -5 -print
            exit 1
          fi

      - name: Validate public association files
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://comemivesto.app/.well-known/assetlinks.json" -o /tmp/assetlinks.json
          curl -fsSL "https://comemivesto.app/.well-known/apple-app-site-association" -o /tmp/aasa.json

          python3 - <<'PY'
          import json

          with open('/tmp/assetlinks.json', encoding='utf-8') as f:
              assetlinks = json.load(f)
          assert any(
              item.get('target', {}).get('package_name') == 'com.acasale.comemivesto'
              for item in assetlinks
          ), 'Android assetlinks does not contain ComeMiVesto package'

          with open('/tmp/aasa.json', encoding='utf-8') as f:
              aasa = json.load(f)
          details = aasa.get('applinks', {}).get('details', [])
          assert any(
              item.get('appID') == 'Z9SD7XVK87.com.acasale.comemivesto'
              for item in details
          ), 'Apple association file does not contain ComeMiVesto appID'
          PY
