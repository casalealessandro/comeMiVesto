name: Guest branch verification (no deploy)
on:
  push:
    branches:
      - feature/guest-auth-mvp

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --configuration=production
      - run: npm test -- --watch=false --browsers=ChromeHeadless --no-progress --include=src/app/auth.guard.spec.ts --include=src/app/app-routing.module.spec.ts
