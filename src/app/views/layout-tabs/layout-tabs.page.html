<ion-menu *ngIf="!isGuest" side="end" contentId="main-content">
  <ion-content class="menu-main-container">
    <app-menu></app-menu>
  </ion-content>
</ion-menu>

<ion-tabs class="app-layout-tabs" id="main-content" (ionTabsWillChange)="onTabWillChange()" (ionTabsDidChange)="onTabChange($event)">
  <app-header slot="top"></app-header>
  <ion-tab-bar
    slot="bottom"
    class="outfit-bottom-bar"
    [class.outfit-bottom-bar-hidden]="hideBottomBar"
    [translucent]="true"
  >
    <div class="toolbar-container">
      <div class="button-block">
        <ion-tab-button class="outfit-bar-button" tab="myoutfit">
          <ion-ripple-effect></ion-ripple-effect>
          <span class="fi fi-rr-house-chimney"></span>
          <span class="outfit-tab-text">Home</span>
        </ion-tab-button>
      </div>
      <div class="button-block" *ngIf="!isGuest">
        <ion-tab-button class="outfit-bar-button" tab="outfit-products">
          <ion-ripple-effect></ion-ripple-effect>
          <span class="fi fi-rr-search"></span>
          <span class="outfit-tab-text">Prodotti</span>
        </ion-tab-button>
      </div>

      <div class="button-block" *ngIf="!isGuest">
        <div class="outfit-center-button">
          <ion-tab-button class="outfit-bar-button center-tab-button" tab="add-outfit">
            <ion-ripple-effect></ion-ripple-effect>
            <span class="fi fi-rr-plus"></span>
          </ion-tab-button>
          <span class="center-tab-text">Crea outfit</span>
        </div>
      </div>
      <div class="button-block" *ngIf="!isGuest">
        <ion-tab-button class="outfit-bar-button" tab="my-wardrobes">
          <ion-ripple-effect></ion-ripple-effect>
          <span class="fi fi-rr-clothes-hanger"></span>
          <span class="outfit-tab-text">Armadio</span>
        </ion-tab-button>
      </div>
      <div class="button-block" *ngIf="!isGuest">
        <ion-tab-button class="outfit-bar-button" tab="my-profile">
          <ion-ripple-effect></ion-ripple-effect>
          <span class="fi fi-rr-user"></span>
          <span class="outfit-tab-text">Profilo</span>
        </ion-tab-button>
      </div>
      <div class="button-block" *ngIf="isGuest">
        <ion-button size="small" routerLink="/download">Scarica l'app</ion-button>
      </div>
    </div>
  </ion-tab-bar>
</ion-tabs>

<!-- Non-blocking invitation: shown once per session after meaningful guest outfit exploration. -->
<section *ngIf="guestNudgeVisible && isGuest" class="guest-save-nudge"
         role="dialog" aria-modal="false" aria-labelledby="guest-save-nudge-title"
         aria-describedby="guest-save-nudge-description">
  <button type="button" class="guest-save-nudge-close"
          aria-label="Chiudi invito" (click)="dismissGuestNudge()">
    <ion-icon name="close-outline" aria-hidden="true"></ion-icon>
  </button>
  <div class="guest-save-nudge-heading">
    <span class="guest-save-nudge-icon" aria-hidden="true">
      <ion-icon name="heart-outline"></ion-icon>
    </span>
    <div>
      <h2 id="guest-save-nudge-title">Hai trovato un look che ti piace?</h2>
      <p id="guest-save-nudge-description">
        {{ guestNudgeOutfitId
          ? "Salva l'ultimo outfit che hai visto e ritrovalo quando vuoi su ComeMiVesto."
          : 'Per ritrovare i look che ti piacciono, scegli un outfit e tocca il cuore.' }}
      </p>
    </div>
  </div>
  <div class="guest-save-nudge-actions">
    <button type="button" class="guest-save-nudge-primary" (click)="saveGuestNudgeOutfit()">
      {{ guestNudgeOutfitId ? "Salva l'outfit" : 'Scegli un outfit' }}
    </button>
    <button type="button" class="guest-save-nudge-later" (click)="dismissGuestNudge()">
      Continua a esplorare
    </button>
  </div>
</section>

<div *ngIf="tabLoading" class="tab-loading-overlay">
  <div class="tab-loading-content">
    <ion-spinner name="crescent"></ion-spinner>
    <span>Caricamento...</span>
  </div>
</div>
