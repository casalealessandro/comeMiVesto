<div
  #imageContainer
  class="image-container"
  [class.has-image]="!!image"
  [class.editor-mode]="enableNewImagecaptured">
  <!-- Loader che viene mostrato durante il caricamento dell'immagine -->
  <ion-spinner *ngIf="imageLoading" name="crescent"></ion-spinner>

  <img *ngIf="image" #imageElement [src]="image" class="outfit-pin-image" [ngClass]="{'darken': showTag && enableSetTagsImage}"
    (click)="addTag($event)" />
  <!-- Suggerimento per il tagging -->
  <div class="tag-helper" *ngIf="showTooltip()">
    <ion-icon name="pricetag-outline" aria-hidden="true"></ion-icon>
    <span>Tocca un punto della foto per taggare un capo</span>
  </div>
  
  <ng-container *ngIf="showTag">
    <ng-container *ngIf="enableSetTagsImage; else viewTags">
    <div *ngFor="let tag of tags" class="tag" [ngStyle]="tagStyle[tag.id]" (click)="openItmClothing(tag)">
      <ion-card class="price-card">
        <ion-card-content class="price-card-content">
          <div >
            <span class="item-brend">{{ tag.brend }}</span>
            <p class="item-title">{{ tag.name  }}</p>
           

          </div>
         
          <div class="item-price">{{ tag.prezzo | currencyFormat }}</div>
        </ion-card-content>
      </ion-card>

    </div>
    </ng-container>
    <ng-template #viewTags>
      <button
        *ngFor="let tag of tags; let i = index"
        type="button"
        class="tag-marker"
        [class.is-active]="selectedTag === tag"
        [ngStyle]="tagStyle[tag.id]"
        [attr.aria-label]="'Mostra informazioni su ' + tag.name"
        [attr.aria-pressed]="selectedTag === tag"
        (click)="selectedTag = selectedTag === tag ? null : tag">
        <span>{{ i + 1 }}</span>
      </button>

      <div class="tag-detail-card" *ngIf="selectedTag as activeTag">
        <button
          type="button"
          class="tag-detail-close"
          aria-label="Chiudi informazioni prodotto"
          (click)="selectedTag = null">
          <ion-icon name="close-outline" aria-hidden="true"></ion-icon>
        </button>
        <div class="tag-detail-brand" *ngIf="activeTag.brend">{{ activeTag.brend }}</div>
        <p class="tag-detail-title">{{ activeTag.name }}</p>
        <p class="tag-detail-price" *ngIf="activeTag.prezzo != null || activeTag.price != null">
          {{ (activeTag.prezzo ?? activeTag.price) | currencyFormat }}
        </p>
        <button
          *ngIf="activeTag.catalogProductId || (activeTag.link && activeTag.link !== '#')"
          type="button"
          class="tag-detail-open"
          (click)="openItmClothing(activeTag)">
          Visualizza prodotto
          <ion-icon name="arrow-forward-outline" aria-hidden="true"></ion-icon>
        </button>
      </div>
    </ng-template>
  </ng-container>
  <ion-button class="tag-toggle-button" *ngIf="tags.length>0" (click)="toggleTags()" id="toggle-button"
    [ngStyle]="tagToggleButton" fill="clear">
   
    <i class="fi fi-rr-tags"></i>
  </ion-button>
  <ion-button
    *ngIf="enableNewImagecaptured && image"
    size="small"
    class="change-photo"
    (click)="captureImage()">
    <ion-icon slot="start" name="camera-outline"></ion-icon>
    Cambia foto
  </ion-button>

  <section *ngIf="enableNewImagecaptured && !image" class="photo-upload-section">
    <div class="photo-upload-copy">
      <h2>Foto dell'outfit</h2>
      <p>Carica una foto del look.</p>
    </div>

    <button
      type="button"
      class="photo-upload-card"
      (click)="captureImage()"
      aria-label="Aggiungi foto dell'outfit">
      <ion-icon name="images-outline" aria-hidden="true"></ion-icon>
      <span>Aggiungi foto</span>
    </button>
  </section>
</div>
