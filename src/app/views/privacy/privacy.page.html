<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="handleBackButton()" size="small">
        <ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ page?.title || 'Privacy Policy' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="privacy-content">
  <div class="privacy-state" *ngIf="loading">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Caricamento Privacy Policy...</p>
  </div>

  <div class="privacy-state privacy-state--error" *ngIf="!loading && error">
    <ion-icon name="alert-circle-outline"></ion-icon>
    <p>{{ error }}</p>
    <ion-button fill="outline" (click)="loadPrivacy()">Riprova</ion-button>
  </div>

  <ion-card *ngIf="!loading && !error && page">
    <ion-card-content>
      <div class="privacy-text">{{ page.content }}</div>
    </ion-card-content>
  </ion-card>
</ion-content>
