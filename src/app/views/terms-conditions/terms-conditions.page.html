<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button *ngIf="mode === 'view'" (click)="handleBackButton()" size="small">
        <ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ page?.title || 'Termini di Servizio' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="terms-content">
  <div class="terms-state" *ngIf="loading">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Caricamento Termini di Servizio...</p>
  </div>

  <div class="terms-state terms-state--error" *ngIf="!loading && error">
    <ion-icon name="alert-circle-outline"></ion-icon>
    <p>{{ error }}</p>
    <ion-button fill="outline" (click)="loadTerms()">Riprova</ion-button>
  </div>

  <ion-card *ngIf="!loading && !error && page">
    <ion-card-header>
      <ion-card-subtitle>Versione {{ page.version }}.0</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <div class="terms-text">{{ page.content }}</div>
    </ion-card-content>
  </ion-card>
</ion-content>

<ion-footer *ngIf="requiresAcceptance">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button color="medium" (click)="decline()">
        {{ mode === 'registration' ? 'Non accetto' : 'Esci' }}
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button
        [disabled]="loading || !!error || !page || !isScrollAtBottom || accepting"
        (click)="acceptAndContinue()">
        Accetta e continua
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
