<ion-content class="ion-padding">

  <div class="main-content">
    <div class="heading">

      <div class="filter-wrapper">

        <div class="searchbox">
          <div class="form-search">
            <i class="fi fi-rr-search"></i>
            <ion-input type="text" fill="outline" placeholder="Cerchi qualcosa di particolare?"
              class="search-input ion-no-border" [value]="searchText" (ionInput)="onSearchInput($event)">


            </ion-input>
          </div>

          <ion-button size="small" class="search-button" fill="clear" (click)="openFilterModal()">

            <i class="fi fi-rr-settings-sliders"></i>
          </ion-button>




        </div>
      </div>

      <!-- <div class="banner" *ngIf="trendingOutfits.length>0" >

        <div class="menu">
          <div class="card" *ngFor="let item of trendingOutfits">
            <div class="img" [style.backgroundImage]="'url(' + item.imageUrl + ')'" (click)="hasOutfitVisitFull(item)">
              <ion-label class="text">{{item.title}}</ion-label>
             
            </div>
          </div>
        </div>
      </div> -->


      <div class="spinner" *ngIf="isLoading">

        <ion-spinner></ion-spinner>

      </div>

      <div class="style-main" *ngIf="!isLoading">

        <ion-segment class="filter-outfits" [value]="selectedSegment" (ionChange)="onSegmentChange($event)">
          <ion-segment-button *ngFor="let button of segmentButtons" class="stat-btn" [value]="button.value">
            <div class="stat">
              <i class="icon" [class]="button.icon"></i>
              <ion-label class="stats-label">{{ button.label }}</ion-label>

            </div>
          </ion-segment-button>
        </ion-segment>

        <section class="suggested-discovery" *ngIf="selectedSegment === 'suggeriti'">
          <div class="recommended-outfits" *ngIf="recommendedOutfits.length > 0">
            <div class="recommended-outfits-heading">
              <span class="suggested-kicker">{{ recommendationTitle }}</span>
              <span class="recommended-outfits-context">{{ recommendationContext }}</span>
            </div>

            <div class="recommended-outfits-grid">
              <article class="recommended-outfit-card" *ngFor="let recommendedOutfit of recommendedOutfits">
                <button type="button" class="recommended-outfit-image" (click)="hasOutfitVisitFull(recommendedOutfit)">
                  <img [src]="recommendedOutfit.imageUrl || 'assets/images/fallback-image.jpg'"
                    [alt]="recommendedOutfit.title"
                    (error)="$any($event.target).src='assets/images/fallback-image.jpg'" />
                </button>

                <div class="recommended-outfit-info">
                  <strong>{{ recommendedOutfit.title }}</strong>
                  <button type="button" class="recommended-outfit-favorite"
                    (click)="addFavoriteOutfit(recommendedOutfit)"
                    [attr.aria-label]="isFavorite(recommendedOutfit.id) ? 'Rimuovi dai preferiti' : 'Aggiungi ai preferiti'">
                    <i class="fi" [ngClass]="isFavorite(recommendedOutfit.id) ? 'fi-sr-heart' : 'fi-rs-heart'"></i>
                  </button>
                </div>
              </article>
            </div>
          </div>

          <div class="suggested-outfit-title" *ngIf="suggestedOutfitsForGrid.length > 0">
            <div>
              <h3>Outfit che potrebbero piacerti</h3>
              <span>In base alle tue preferenze</span>
            </div>
          </div>

          <div class="suggested-outfit-grid" *ngIf="suggestedOutfitsForGrid.length > 0">
            <article class="suggested-outfit-card" *ngFor="let outfit of suggestedOutfitsForGrid">
              <button type="button" class="suggested-outfit-image" (click)="hasOutfitVisitFull(outfit)">
                <img [src]="outfit.imageUrl || 'assets/images/fallback-image.jpg'" [alt]="outfit.title"
                  (error)="$any($event.target).src='assets/images/fallback-image.jpg'" />
              </button>
              <div class="suggested-outfit-info">
                <strong>{{ outfit.title }}</strong>
                <button type="button" class="suggested-outfit-favorite" (click)="addFavoriteOutfit(outfit)"
                  [attr.aria-label]="isFavorite(outfit.id) ? 'Rimuovi dai preferiti' : 'Aggiungi ai preferiti'">
                  <i class="fi" [ngClass]="isFavorite(outfit.id) ? 'fi-sr-heart' : 'fi-rs-heart'"></i>
                </button>
              </div>
            </article>
          </div>

          <div class="suggested-products" *ngIf="isSuggestedProductsLoading || suggestedProducts.length > 0">
            <div class="suggested-section-title">
              <div>
                <h3>Prodotti che potrebbero piacerti</h3>
                <span>Dal catalogo ComeMiVesto</span>
              </div>
            </div>

            <div class="suggested-products-loading" *ngIf="isSuggestedProductsLoading">
              <ion-spinner name="crescent"></ion-spinner>
            </div>

            <div class="suggested-products-scroll" *ngIf="!isSuggestedProductsLoading && suggestedProducts.length > 0">
              <button type="button" class="suggested-product-card" *ngFor="let product of suggestedProducts"
                (click)="openSuggestedProduct(product)">
                <div class="suggested-product-image">
                  <img [src]="product.imageUrl || 'assets/images/fallback-image.jpg'" [alt]="product.name"
                    (error)="$any($event.target).src='assets/images/fallback-image.jpg'" />
                </div>
                <div class="suggested-product-info">
                  <span class="suggested-product-brand">{{ product.brend || product.brand }}</span>
                  <strong>{{ product.name }}</strong>
                  <span class="suggested-product-price">{{ product.price | number:'1.2-2' }} €</span>
                </div>
              </button>
            </div>
          </div>
        </section>

        <ion-row class="style" *ngIf="selectedSegment !== 'suggeriti'">
          <ion-col class="style-col" size="12" *ngFor="let outfit of filteredOutfits">

            <ion-card class="outfit-card">
              <div class="outfit-header">
                <button type="button" class="outfit-header-wrapper-title" *ngIf="outfitUserProfile[outfit.userId]"
                  (click)="openUserProfile(outfit.userId)">
                  <ion-avatar slot="start" class="outfit-card-avatar">
                    <img *ngIf="outfitUserProfile[outfit.userId]" [src]="outfitUserProfile[outfit.userId].photoURL" />
                  </ion-avatar>
                  <ion-card-title class="outfit-card-title">

                    {{ outfitUserProfile[outfit.userId].displayName }}
                  </ion-card-title>
                </button>
                <div class="outfit-header-wrapper-info">
                  <ion-button size="small" fill="clear" (click)="outfitMenu(outfit)">
                    <i class="fi fi-rr-menu-dots-vertical"></i>
                  </ion-button>
                  <ion-button size="small" fill="clear" slot="end" (click)="openShareModal(outfit)">
                    <i class="fi fi-rr-share"></i>
                  </ion-button>
                </div>
              </div>
              <div class="outfit-center-wrapper">

                <app-foto-outfit [image]="outfit.imageUrl" [enableNewImagecaptured]="false" [enableSetTagsImage]="false"
                  [tags]="outfit.tags" (eventImageShowFull)="hasOutfitVisitFull(outfit)">
                </app-foto-outfit>


              </div>


              <div class="outfit-bottom-wrapper">


                <ion-card-content class="outfit-bottom-content">
                  <div class="outfit-bottom-content-top">
                    <div class="letf-bottom-content">
                      <ion-card-subtitle class="outfit-card-subTitle">{{ outfit.title }}</ion-card-subtitle>
                    </div>
                    <div class="right-bottom-content">

                      <ion-button size="small" slot="icon-only" fill="clear" class="outfit-card-action"
                        (click)="addFavoriteOutfit(outfit)">

                        <i class="fi" [ngClass]="isFavorite(outfit.id) ? 'fi-sr-heart' : 'fi-rs-heart'">
                        </i>

                      </ion-button>
                      <!-- <ion-button size="small" fill="clear" (click)="showOutfitComposition(outfit.tags)">
                          <ion-icon name="shirt-outline" aria-label="Salva otfit"></ion-icon>
                        </ion-button>
                        -->

                    </div>

                  </div>
                  <div class="outfit-bottom-content-bottom">
                    <p class="outfit-description">{{ outfit.description }}</p>
                  </div>


                </ion-card-content>

              </div>
            </ion-card>

          </ion-col>
        </ion-row>


      </div>

    </div>
  </div>
  <!-- <ion-refresher slot="fixed" (ionRefresh)="refreshOutfits($event)">
        <ion-refresher-content></ion-refresher-content>
      </ion-refresher> -->

</ion-content>
